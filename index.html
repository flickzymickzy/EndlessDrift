<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08101a" />
  <meta name="description" content="ENDLESS DRIFT — drift physics, Drift Pass cosmetics, Drift Coins and near-miss challenges." />

  <link rel="stylesheet" href="./src/style.css" />

  <div id="app"><div style="color:white;background:#08101a;min-height:100vh;padding:15vh 8vw;font:700 30px system-ui">ENDLESS DRIFT <div style="font-size:16px;margin-top:18px;font-weight:400">Loading game... If this stays here, open Terminal and make sure <code>node server.js</code> is running.</div></div></div>
